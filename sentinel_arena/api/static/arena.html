<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel Arena</title>
<style>
  :root{--bg:#0b0d12;--panel:#13161d;--border:#232833;--fg:#e8eaed;--muted:#8b93a1;
        --red:#ef4444;--blue:#3b82f6;--green:#22c55e;--amber:#f59e0b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);
       color:var(--fg);}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);
         flex-wrap:wrap;}
  h1{font-size:1.1rem;margin:0;letter-spacing:.02em}
  .badge{font-size:.7rem;color:var(--muted);border:1px solid var(--border);padding:3px 8px;border-radius:20px}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,button{background:var(--panel);color:var(--fg);border:1px solid var(--border);
         border-radius:8px;padding:7px 12px;font-size:.85rem}
  button{cursor:pointer;font-weight:600}
  button.go{background:var(--green);color:#04210f;border:none}
  button:disabled{opacity:.5;cursor:default}
  .score{display:flex;gap:22px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border)}
  .dial{font-size:2rem;font-weight:800}
  .stat{font-size:.72rem;color:var(--muted)}.stat b{display:block;font-size:1rem;color:var(--fg)}
  .map{padding:10px 20px;border-bottom:1px solid var(--border)}
  .nodes{display:flex;gap:10px;flex-wrap:wrap}
  .node{font-size:.72rem;padding:5px 10px;border-radius:8px;border:1px solid var(--border);
        color:var(--muted);transition:.3s}
  .node.lit{background:#1e293b;color:var(--fg);border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
  .node.flag.lit{border-color:var(--red);box-shadow:0 0 0 1px var(--red);color:#fff}
  main{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:40vh}
  .col{padding:12px 20px;overflow:auto;max-height:52vh}
  .col.red{border-right:1px solid var(--border)}
  .col h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
  .col.red h2{color:var(--red)}.col.blue h2{color:var(--blue)}
  .ev{font-size:.82rem;padding:7px 10px;margin-bottom:6px;border-radius:8px;background:var(--panel);
      border-left:3px solid var(--border);animation:in .25s ease}
  .ev.red{border-left-color:var(--red)}.ev.blue{border-left-color:var(--blue)}
  .ev .t{color:var(--muted);font-size:.68rem}
  .ev .att{color:var(--amber);font-size:.68rem}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  @media(max-width:720px){main{grid-template-columns:1fr}.col.red{border-right:none}}
</style></head>
<body>
<header>
  <h1>⚔ Sentinel Arena</h1>
  <span class="badge" id="status">idle</span>
  <div class="controls">
    <select id="blue"><option value="scripted">Blue: scripted</option>
      <option value="noop">Blue: passive (no-op)</option></select>
    <select id="seed"><option>42</option><option>7</option><option>101</option></select>
    <button class="go" id="run">Run engagement</button>
  </div>
</header>

<div class="score">
  <div><div class="dial" id="res">—</div><div class="stat">resilience / 100</div></div>
  <div class="stat"><b id="red">0</b>red</div>
  <div class="stat"><b id="blue-score">0</b>blue</div>
  <div class="stat"><b id="flag">—</b>flag</div>
  <div class="stat"><b id="tick">—</b>tick</div>
  <a id="reportlink" class="badge" style="display:none" href="#" target="_blank">open full report ↗</a>
</div>

<div class="map"><div class="nodes" id="nodes"></div></div>

<main>
  <div class="col red"><h2>Red — attacker</h2><div id="redfeed"></div></div>
  <div class="col blue"><h2>Blue — defender</h2><div id="bluefeed"></div></div>
</main>

<script>
const NODES = ["/", "/search", "/config.json", "/error", "admin", "flag"];
function paintNodes(){
  const c = document.getElementById("nodes"); c.innerHTML="";
  NODES.forEach(n=>{const d=document.createElement("div");
    d.className="node"+(n==="flag"?" flag":"");d.id="node-"+n;d.textContent=n;c.appendChild(d);});
}
function lightNode(name){const el=document.getElementById("node-"+name);if(el)el.classList.add("lit");}

function addEvent(ev){
  const team = ev.team==="red"?"red":ev.team==="blue"?"blue":null;
  if(team){
    const feed=document.getElementById(team==="red"?"redfeed":"bluefeed");
    const att = ev.data && ev.data.attack_technique ?
      `<div class="att">ATT&CK ${ev.data.attack_technique} · ${ev.data.tactic||""}</div>`:"";
    const div=document.createElement("div");div.className="ev "+team;
    div.innerHTML=`<div class="t">tick ${ev.tick} · ${ev.kind}</div>${ev.summary}${att}`;
    feed.prepend(div);
  }
  if(ev.tick>=0) document.getElementById("tick").textContent=ev.tick;
  // Light up the network map from request + finding events.
  const s=(ev.summary||"")+JSON.stringify(ev.data||{});
  NODES.forEach(n=>{ if(s.includes(n) || (n==="admin"&&s.includes("admin")) ||
     (n==="flag"&&s.includes("flag"))) lightNode(n); });
  if(ev.kind==="score"&&ev.data){
    document.getElementById("res").textContent=ev.data.resilience;
    document.getElementById("red").textContent=ev.data.red;
    document.getElementById("blue-score").textContent=ev.data.blue;
  }
}

document.getElementById("run").onclick=async()=>{
  const btn=document.getElementById("run");btn.disabled=true;
  document.getElementById("redfeed").innerHTML="";
  document.getElementById("bluefeed").innerHTML="";
  paintNodes();
  document.getElementById("status").textContent="starting…";
  const blue=document.getElementById("blue").value, seed=document.getElementById("seed").value;
  const res=await fetch(`/engagements?scenario=shop-01&seed=${seed}&blue=${blue}`,{method:"POST"});
  const {id}=await res.json();
  document.getElementById("status").textContent="running "+id;
  const proto=location.protocol==="https:"?"wss":"ws";
  const ws=new WebSocket(`${proto}://${location.host}/ws/${id}`);
  ws.onmessage=(m)=>{const msg=JSON.parse(m.data);
    if(msg.type==="event")addEvent(msg.event);
    else if(msg.type==="done"){
      document.getElementById("status").textContent="done";btn.disabled=false;
      const r=msg.result||{};
      document.getElementById("flag").textContent=r.flag_captured?"captured":"held";
      if(r.report){const l=document.getElementById("reportlink");
        l.href=r.report;l.style.display="inline-block";}
    }};
  ws.onerror=()=>{document.getElementById("status").textContent="ws error";btn.disabled=false;};
};
paintNodes();
</script>
</body></html>
