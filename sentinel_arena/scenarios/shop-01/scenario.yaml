id: shop-01
name: "Corner Shop"
description: >
  A small storefront web app with a handful of intentionally planted,
  non-destructive weaknesses. The bundled vulnerable app serves these so the
  engagement runs fully offline against localhost. The flag is a planted secret
  reachable only by discovering a randomized endpoint.

max_ticks: 12

health:
  path: /health
  expect_status: 200

# Template endpoints; overridden per engagement by the randomizer below.
flag_path: /files
admin_path: /admin

randomize:
  - flag_path
  - admin_path

weaknesses:
  - id: missing-headers
    owasp: A05
    severity: medium
    title: "Missing security response headers"
    detect: security_headers
    mitigation: >
      Set X-Content-Type-Options, X-Frame-Options, and a Content-Security-Policy
      on every response.

  - id: reflected-xss
    owasp: A03
    severity: high
    title: "Reflected input in /search without output encoding"
    detect: reflected_xss
    mitigation: >
      Context-aware output encoding for all user input; add a strict CSP as
      defense in depth.

  - id: exposed-admin
    owasp: A01
    severity: high
    title: "Admin panel reachable without authentication"
    detect: exposed_admin
    mitigation: >
      Require authentication and authorization on all admin routes; do not rely
      on an unguessable path.

  - id: verbose-errors
    owasp: A05
    severity: low
    title: "Verbose server errors leak stack traces"
    detect: verbose_errors
    mitigation: >
      Return generic error pages; log details server-side only.

  - id: sensitive-file
    owasp: A05
    severity: medium
    title: "Sensitive config file exposed under web root"
    detect: sensitive_file
    mitigation: >
      Remove secrets from the web root; deny access to dotfiles and config
      files at the server.
